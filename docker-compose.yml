version: "3.9"

services:
  api1:
    build:
      context: .
      dockerfile: L1-Retro_Video_Game_Exchange_Hypermedia_Rest_API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/exchange.db
      DisableHttpsRedirection: "true"
      INSTANCE_NAME: api1
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserTopic: users
      Kafka__OfferTopic: offers
    volumes:
      - exchange-data:/data
    networks:
      - exchange-net
    ports:
      - "8081:8080"

  api2:
    build:
      context: .
      dockerfile: L1-Retro_Video_Game_Exchange_Hypermedia_Rest_API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/exchange.db
      DisableHttpsRedirection: "true"
      INSTANCE_NAME: api2
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserTopic: users
      Kafka__OfferTopic: offers
    volumes:
      - exchange-data:/data
    networks:
      - exchange-net
    ports:
      - "8082:8080"

  nginx:
    build:
      context: ./nginx
    depends_on:
      - api1
      - api2
    ports:
      - "8080:8080"
    networks:
      - exchange-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - exchange-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - exchange-net

  notification-worker:
    build:
      context: .
      dockerfile: NotificationWorker/Dockerfile
    depends_on:
      - kafka
    environment:
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserTopic: users
      Kafka__OfferTopic: offers
      SMTP__Host: smtp.ethereal.email
      SMTP__Port: 587
      SMTP__User: ian35@ethereal.email
      SMTP__Pass: TYg9BMsh6yafnEUgNE
      SMTP__From: ian35@ethereal.email
      SMTP__EnableSsl: "true"
    networks:
      - exchange-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command:
      - --kafka.server=kafka:9092
    depends_on:
      - kafka
    networks:
      - exchange-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      - exchange-net

  prometheus:
    build:
      context: ./Prometheus
    ports:
      - "9090:9090"
    networks:
      - exchange-net

  loki:
    image: grafana/loki:2.9.8
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    networks:
      - exchange-net

  promtail:
    image: grafana/promtail:2.9.8
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - exchange-net

  grafana:
    image: grafana/grafana-oss:10.4.3
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - exchange-net

volumes:
  exchange-data:
  grafana-data:
  loki-data:

networks:
  exchange-net: